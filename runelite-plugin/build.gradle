plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gielinorcompanion.exporter.CompanionLauncher'

// Check for a new RuneLite release on every build/launch (default is 24h), so the
// play shortcut never starts an outdated client after a Wednesday game update.
configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.gielinorcompanion'
version = '0.8.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Developer client: dev tools on, assertions on. For testing only.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// JVM arguments the official launcher passes to the client (static.runelite.net/bootstrap.json, clientJvm17Arguments).
def clientJvmArgs = [
	'-XX:+DisableAttachMechanism',
	'-Xmx768m',
	'-Xss2m',
	'-XX:CompileThreshold=1500',
	'--add-opens=java.base/java.net=ALL-UNNAMED',
	'--add-opens=java.base/java.io=ALL-UNNAMED',
	// ExternalPluginManager.loadBuiltin refuses to run without assertions. Enable them only there
	// and in our own code, so RuneLite and Plugin Hub plugins behave exactly as in the normal client.
	'-ea:net.runelite.client.externalplugins.ExternalPluginManager',
	'-ea:com.gielinorcompanion...',
]

// Writes a java @argfile used by ../play.cmd to start the normal (non-developer) client
// with our plugin built in. Forward slashes avoid argfile backslash-escaping on Windows.
tasks.register('writeLaunchArgs') {
	dependsOn 'testClasses'
	def out = layout.buildDirectory.file('launch/args.txt')
	outputs.file(out)
	outputs.upToDateWhen { false }
	doLast {
		def cp = sourceSets.test.runtimeClasspath.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator)
		def lines = clientJvmArgs + ['-cp', '"' + cp + '"', pluginMainClass]
		out.get().asFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
